name: Manual CHPCC release-candidate gate

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Exact immutable HTTPS CHPCC Cloudflare deployment URL
        required: true
        type: string
      expected_version:
        description: Expected visible version without leading v
        required: true
        default: '0.22'
        type: string

run-name: CHPCC v${{ inputs.expected_version }} release candidate — ${{ inputs.target_url }}

permissions:
  contents: read

concurrency:
  group: chpcc-release-candidate-${{ inputs.target_url }}
  cancel-in-progress: true

jobs:
  release-candidate:
    name: CHPCC release-candidate tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TEST_BASE_URL: ${{ inputs.target_url }}
      TEST_APPLICATION: chpcc
      TEST_EXPECTED_VERSION: ${{ inputs.expected_version }}
      CI: 'true'

    steps:
      - name: Check out automation repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run CHPCC release-candidate gate
        run: >
          npx playwright test
          tests/chpcc-release-candidate
          --project=desktop-chromium
          --workers=1

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chpcc-release-candidate-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
