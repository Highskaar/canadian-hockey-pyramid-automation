name: Manual preview smoke test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Exact HTTPS Cloudflare preview or production URL
        required: true
        type: string
      application:
        description: Application being tested
        required: true
        default: chp
        type: choice
        options:
          - chp
          - chpcc
      expected_version:
        description: Expected visible version, without the leading v (for example 1.108)
        required: true
        default: '1.108'
        type: string

run-name: ${{ inputs.application }} v${{ inputs.expected_version }} smoke — ${{ inputs.target_url }}

permissions:
  contents: read

concurrency:
  group: smoke-${{ inputs.application }}-${{ inputs.target_url }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test exact deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_BASE_URL: ${{ inputs.target_url }}
      TEST_APPLICATION: ${{ inputs.application }}
      TEST_EXPECTED_VERSION: ${{ inputs.expected_version }}
      CI: 'true'

    steps:
      - name: Check out automation repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run application-specific smoke tests
        shell: bash
        run: |
          set -euo pipefail

          case "${TEST_APPLICATION}" in
            chp)
              npx playwright test tests/smoke
              ;;
            chpcc)
              npx playwright test tests/chpcc-smoke
              ;;
            *)
              echo "Unsupported application: ${TEST_APPLICATION}"
              exit 1
              ;;
          esac

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-${{ inputs.application }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
