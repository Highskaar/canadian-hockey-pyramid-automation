name: Manual release-candidate gate

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Exact immutable HTTPS Cloudflare deployment URL
        required: true
        type: string
      expected_version:
        description: Expected visible version without leading v
        required: true
        default: '1.108'
        type: string

run-name: CHP v${{ inputs.expected_version }} release candidate — ${{ inputs.target_url }}

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.target_url }}
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TEST_BASE_URL: ${{ inputs.target_url }}
      TEST_APPLICATION: chp
      TEST_EXPECTED_VERSION: ${{ inputs.expected_version }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run release-candidate gate
        run: npx playwright test tests/release-candidate --project=desktop-chromium --workers=1
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
